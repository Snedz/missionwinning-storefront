</head><body>
<header><a href="index.html">Invoice Lite</a></header>
<main>
<h1>Refund receipt</h1>
<p>Print or save as PDF when you refund a client. Keeps your books honest.</p>
<pre id="out"></pre>
<button type="button" id="fill">Fill sample</button>
</main>
<script>
const sample=`Refund receipt

From: Your Studio
To: ACME Co
Date: 2026-09-17
Original invoice: #1042

Refunded: $90.00
Method: card
Reason: unused hours

This confirms the refund has been issued.`;
document.getElementById('fill').onclick=()=>{document.getElementById('out').textContent=sample};
document.getElementById('out').textContent='Click Fill sample, then print / Save as PDF.';
</script>
