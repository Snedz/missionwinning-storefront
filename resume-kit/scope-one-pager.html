<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scope one-pager — blanks</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.45; }
    h1 { font-size: 1.25rem; }
    label { display: block; margin-top: 0.75rem; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; }
    .note { color: #444; font-size: 0.9rem; }
    @media print { .note { display: none; } }
  </style>
</head>
<body>
  <h1>Scope one-pager (blanks)</h1>
  <p class="note">Fill locally. Not legal advice. Checkout is live on the main product page. Updated 2026-09-30.</p>
  <label>Client / project<input name="client" placeholder="" /></label>
  <label>Outcome (one sentence)<textarea name="outcome" rows="2"></textarea></label>
  <label>In scope<textarea name="in" rows="4"></textarea></label>
  <label>Out of scope<textarea name="out" rows="3"></textarea></label>
  <label>Timeline<input name="when" /></label>
  <label>Price / rate (seller writes)<input name="price" /></label>
</body>
</html>
