  <h1>Print note</h1>
  <p>Open a template in a browser and use Print to save a PDF. Turn headers and footers off. The pack does not calculate tax, send the invoice, or take payment for you.</p>
  <p>The price on the storefront is the one-time pack price in <code>config.js</code>. It is not an hourly rate.</p>
